<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 導覽驗證</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; line-height: 1.6; }
        .btn { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>地點限定導覽</h2>
    <p>請開啟手機定位，並點擊下方按鈕以確認您在指定地點。</p>
    <button class="btn" onclick="checkLocation()">開始驗證地點</button>
    <p id="status"></p>

    <script>
        // 請在此處修改您的目標座標與 360 圖片網址
        const targetLat = 25.0131; // 目標緯度
        const targetLon = 121.5418; // 目標經度
        const targetUrl = "https://tour.panoee.net/69dad6632e463550313e234a"; 

        function checkLocation() {
            const status = document.getElementById('status');
            status.innerText = "定位中，請稍候...";

            if (!navigator.geolocation) {
                status.innerText = "您的瀏覽器不支援定位功能。";
                return;
            }

            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                
                // 計算歐幾里得距離（簡易判斷法）
                const dist = Math.sqrt(Math.pow(lat - targetLat, 2) + Math.pow(lon - targetLon, 2));
                
                if (dist < 0.0015) { // 約 150 公尺內可解鎖
                    status.innerText = "驗證成功！正在前往導覽頁面...";
                    window.location.href = targetUrl;
                } else {
                    status.innerText = "驗證失敗：您目前不在指定地點。";
                }
            }, (err) => {
                status.innerText = "無法讀取定位，請確認已開啟手機定位權限。";
            }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
