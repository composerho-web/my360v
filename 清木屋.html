<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360 導覽：方位驗證</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding-top: 50px; line-height: 1.6; color: #333; background-color: #f8f9fa; }
        .card { background: white; max-width: 350px; margin: 0 auto; padding: 30px; border-radius: 15px; shadow: 0 4px 6px rgba(0,0,0,0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .btn { padding: 15px 30px; background: #007bff; color: white; border: none; border-radius: 50px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn:active { transform: scale(0.98); }
        #status { margin-top: 25px; font-size: 1.2em; }
        #direction-info { color: #555; font-size: 1.1em; margin-top: 15px; padding: 10px; background: #e9ecef; border-radius: 8px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>請移動至清木屋</h2>
        <p>請檢查您的位置以解鎖 360 內容</p>
        <button class="btn" onclick="checkLocation()">檢查我的位置</button>
        
        <div id="status"></div>
        <div id="direction-info"></div>
    </div>

    <script>
        // --- 設定區 ---
        const targetLat = 23.465769176618156; // 目標緯度
        const targetLon = 120.24550950199206; // 目標經度
        const targetUrl = "https://tour.panoee.net/69dad6632e463550313e234a"; 
        const unlockDistance = 100; // 解鎖距離（公尺）

        // --- 數學計算：Haversine 距離 ---
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        // --- 數學計算：方位角 ---
        function getBearing(lat1, lon1, lat2, lon2) {
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            let bearing = Math.atan2(y, x) * 180 / Math.PI;
            return (bearing + 360) % 360; // 轉為 0-360 度
        }

        // --- 角度轉文字方向 ---
        function getDirectionText(bearing) {
            const sectors = ["北方", "東北方", "東方", "東南方", "南方", "西南方", "西方", "西北方"];
            const index = Math.round(bearing / 45) % 8;
            return sectors[index];
        }

        function checkLocation() {
            const status = document.getElementById('status');
            const dirInfo = document.getElementById('direction-info');
            
            status.innerText = "正在讀取 GPS...";
            dirInfo.style.display = "none";

            navigator.geolocation.getCurrentPosition((pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                
                const distance = getDistance(lat, lon, targetLat, targetLon);
                const bearing = getBearing(lat, lon, targetLat, targetLon);
                const direction = getDirectionText(bearing);
                const roundedDist = Math.round(distance);

                if (distance <= unlockDistance) {
                    status.style.color = "#28a745";
                    status.innerHTML = "✅ 驗證成功！<br>即將進入謎題...";
                    setTimeout(() => { window.location.href = targetUrl; }, 1500);
                } else {
                    status.style.color = "#dc3545";
                    status.innerText = "尚未到達指定地點";
                    dirInfo.style.display = "block";
                    dirInfo.innerHTML = `目標在您的 <b>${direction}</b><br>距離約 <b>${roundedDist}</b> 公尺`;
                }
            }, (err) => {
                status.innerText = "無法存取定位，請確認開啟 GPS 並使用 HTTPS 連線。";
            }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
