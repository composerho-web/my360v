<!DOCTYPE html>
<html>
<head>
    <title>地點限定導覽</title>
    <meta charset="utf-8">
</head>
<body>
您目前不在指定地點，無法開啟導覽。
    <script>
        const targetLat = 24.9432; // 填入目標緯度
        const targetLon = 121.2345; // 填入目標經度
        const targetUrl = "https://tour.panoee.net/preview?tour=69dad6632e463550313e234a&scene=69dad6852e463537993e2354"; 

        function checkLocation() {
            navigator.geolocation.getCurrentPosition((pos) => {
                const dist = Math.sqrt(Math.pow(pos.coords.latitude - targetLat, 2) + Math.pow(pos.coords.longitude - targetLon, 2));
                if (dist < 0.001) { // 約 100 公尺範圍
                    window.location.href = targetUrl;
                } else {
                    alert("您目前不在指定地點，無法開啟導覽。");
                }
            });
        }
        checkLocation();
    </script>
</body>
</html>
